[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auton-agent"
version = "1.0.0"
description = "A lightweight, portable, autonomous AI agent with an agentic tool loop, skills, persistent memory and Telegram interface."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
